---
# Project source code URL: https://github.com/qBittorrent/qBittorrent

qbittorrent_enabled: true

qbittorrent_identifier: qbittorrent
qbittorrent_base_path: "/{{ qbittorrent_identifier }}"
qbittorrent_data_path: "{{ qbittorrent_base_path }}/data"
# The path where qBittorrent keeps its own configuration (`qBittorrent.conf`, etc.)
qbittorrent_config_path: "{{ qbittorrent_data_path }}/qBittorrent"
# The path to qBittorrent's own configuration file
qbittorrent_config_file_path: "{{ qbittorrent_config_path }}/qBittorrent.conf"
# The path where downloaded files will be stored on the host system
qbittorrent_download_path: "{{ qbittorrent_base_path }}/downloads"
# The path at which qbittorrent_download_path is mounted to inside the container
qbittorrent_download_bind_path: "/downloads"

# The upstream project does not support Renovate. See: https://github.com/linuxserver/docker-qbittorrent/issues/249
qbittorrent_version: 5.2.1

qbittorrent_arch: amd64

qbittorrent_uid: ""
qbittorrent_gid: ""

# The hostname at which qBittorrent is served.
qbittorrent_hostname: ""

# The path at which qBittorrent is served.
# This value must either be `/` or not end with a slash (e.g. `/qbittorrent`).
qbittorrent_path_prefix: /

qbittorrent_container_image: "{{ qbittorrent_container_image_registry_prefix }}linuxserver/qbittorrent:{{ qbittorrent_container_image_tag }}"
qbittorrent_container_image_tag: "{{ qbittorrent_version }}"
qbittorrent_container_image_registry_prefix: "{{ qbittorrent_container_image_registry_prefix_upstream }}"
qbittorrent_container_image_registry_prefix_upstream: "{{ qbittorrent_container_image_registry_prefix_upstream_default }}"
qbittorrent_container_image_registry_prefix_upstream_default: lscr.io/

# The hostname to assign to the container (its `--hostname`).
# Pinned to a stable value, because Docker otherwise randomizes it on each (re)creation,
# which prevents qBittorrent from recovering from a stale `lockfile` left by an unclean shutdown.
qbittorrent_container_hostname: "{{ qbittorrent_identifier }}"

# The base container network. It will be auto-created by this role if it doesn't exist already.
qbittorrent_container_network: "{{ qbittorrent_identifier }}"

# Control if the container network is deleted on uninstalling.
qbittorrent_container_network_deletion_enabled: true

# Specify how the container publishes its HTTP port (as defined by `qbittorrent_container_http_port`).
# Can be used to access the web UI directly (bypassing Traefik)
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
qbittorrent_container_http_host_bind_port: ""

# Specify how the container publishes its torrenting port (as defined by `qbittorrent_container_torrenting_port`).
# To become an "active node" you'll want to set this and configure port-forwarding in your router
# NOTE: This will be exposed with both TCP and UDP
#
# Takes an "<ip>:<port>" or "<port>" value (e.g. "127.0.0.1:2586"), or empty string to not expose.
qbittorrent_container_torrenting_host_bind_port: ""

# The port number in the container for the web UI
qbittorrent_container_http_port: 8080

# The port number in the container for torrenting
qbittorrent_container_torrenting_port: 6881

# A list of additional container networks that the container would be connected to.
# The role does not create these networks, so make sure they already exist.
qbittorrent_container_additional_networks: "{{ (qbittorrent_container_additional_networks_default + qbittorrent_container_additional_networks_auto + qbittorrent_container_additional_networks_custom) | unique }}"
qbittorrent_container_additional_networks_default: []
qbittorrent_container_additional_networks_auto: []
qbittorrent_container_additional_networks_custom: []

# A list of additional "volumes" to mount in the container.
# This list gets populated dynamically at runtime. You can provide a different default value,
# if you wish to mount your own files into the container.
# Contains definition objects like this: `{"type": "bind", "src": "/outside", "dst": "/inside", "options": "readonly"}.
# See the `--mount` documentation for the `docker run` command.
qbittorrent_container_additional_volumes: "{{ qbittorrent_container_additional_volumes_auto + qbittorrent_container_additional_volumes_custom }}"
qbittorrent_container_additional_volumes_auto: []
qbittorrent_container_additional_volumes_custom: []

# qbittorrent_container_labels_traefik_enabled controls whether labels to assist a Traefik reverse-proxy will be attached to the container.
# See `../templates/labels.j2` for details.
#
# To inject your own other container labels, see `qbittorrent_container_labels_additional_labels_custom`.
qbittorrent_container_labels_traefik_enabled: true
qbittorrent_container_labels_traefik_docker_network: "{{ qbittorrent_container_network }}"
qbittorrent_container_labels_traefik_hostname: "{{ qbittorrent_hostname }}"
# The path prefix must either be `/` or not end with a slash (e.g. `/qbittorrent`).
qbittorrent_container_labels_traefik_path_prefix: "{{ qbittorrent_path_prefix }}"
qbittorrent_container_labels_traefik_rule: "Host(`{{ qbittorrent_container_labels_traefik_hostname }}`){% if qbittorrent_container_labels_traefik_path_prefix != '/' %} && PathPrefix(`{{ qbittorrent_container_labels_traefik_path_prefix }}`){% endif %}"
qbittorrent_container_labels_traefik_priority: 0
qbittorrent_container_labels_traefik_entrypoints: web-secure
qbittorrent_container_labels_traefik_tls: "{{ qbittorrent_container_labels_traefik_entrypoints != 'web' }}"
qbittorrent_container_labels_traefik_tls_certResolver: default  # noqa var-naming
qbittorrent_container_labels_traefik_middleware_basic_auth_enabled: false
# See: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/basicauth/
qbittorrent_container_labels_traefik_middleware_basic_auth_users: ""

# qbittorrent_container_labels_additional_labels contains a multiline string with additional labels to add to the container label file.
# See `../templates/labels.j2` for details.
# To add your own custom labels, use `qbittorrent_container_labels_additional_labels_custom`
#
# Example:
# qbittorrent_container_labels_additional_labels_custom:
#   - my.label=1
#   - another.label="here"
qbittorrent_container_labels_additional_labels: "{{ qbittorrent_container_labels_additional_labels_auto + qbittorrent_container_labels_additional_labels_custom }}"
qbittorrent_container_labels_additional_labels_auto: []
qbittorrent_container_labels_additional_labels_custom: []

# Specify the size of the container's tmpfs volume
qbittorrent_container_tmpfs_run_size: 128m

# A list of extra arguments to pass to the container (`docker create` command)
qbittorrent_container_extra_arguments: "{{ qbittorrent_container_extra_arguments_auto + qbittorrent_container_extra_arguments_custom }}"
qbittorrent_container_extra_arguments_auto: []
qbittorrent_container_extra_arguments_custom: []

# List of systemd services that the qBittorrent systemd service depends on
qbittorrent_systemd_required_services_list: "{{ (qbittorrent_systemd_required_services_list_default + qbittorrent_systemd_required_services_list_auto + qbittorrent_systemd_required_services_list_custom) | unique }}"
qbittorrent_systemd_required_services_list_default: "{{ [devture_systemd_docker_base_docker_service_name] if devture_systemd_docker_base_docker_service_name else [] }}"
qbittorrent_systemd_required_services_list_auto: []
qbittorrent_systemd_required_services_list_custom: []

# List of systemd services that the qBittorrent systemd service wants
qbittorrent_systemd_wanted_services_list: "{{ (qbittorrent_systemd_wanted_services_list_default + qbittorrent_systemd_wanted_services_list_auto + qbittorrent_systemd_wanted_services_list_custom) | unique }}"
qbittorrent_systemd_wanted_services_list_default: []
qbittorrent_systemd_wanted_services_list_auto: []
qbittorrent_systemd_wanted_services_list_custom: []

# Controls how long to wait for the container to stop gracefully before killing it.
# Because `devture_systemd_docker_base_container_stop_grace_time_seconds` may be quite short and databases are more important to stop gracefully,
# we default to at least 30 seconds.
qbittorrent_container_stop_grace_time_seconds: "{{ [devture_systemd_docker_base_container_stop_grace_time_seconds, 30] | max }}"

# Controls how long the pre-start cleanup should wait for stale container-name release
# before failing startup explicitly.
qbittorrent_container_cleanup_timeout_seconds: "{{ devture_systemd_docker_base_container_cleanup_timeout_seconds }}"

# Controls the delay between pre-start cleanup retries.
qbittorrent_container_cleanup_retry_delay_seconds: "{{ devture_systemd_docker_base_container_cleanup_retry_delay_seconds }}"

# Shell command used in the systemd pre-start phase to deterministically remove a stale
# container and wait until Docker releases its name.
qbittorrent_container_cleanup_command: |
  i=0;
  while [ "$i" -lt {{ qbittorrent_container_cleanup_timeout_seconds }} ]; do
  {{ devture_systemd_docker_base_host_command_docker }} stop -t {{ qbittorrent_container_stop_grace_time_seconds }} {{ qbittorrent_identifier }} >/dev/null 2>&1 || true;
  {{ devture_systemd_docker_base_host_command_docker }} rm -f {{ qbittorrent_identifier }} >/dev/null 2>&1 || true;
  if {{ devture_systemd_docker_base_host_command_docker }} container inspect {{ qbittorrent_identifier }} >/dev/null 2>&1; then
  i=$((i + 1));
  sleep {{ qbittorrent_container_cleanup_retry_delay_seconds }};
  continue;
  fi;
  if {{ devture_systemd_docker_base_host_command_docker }} info >/dev/null 2>&1; then
  exit 0;
  fi;
  echo "Failed to query Docker daemon while cleaning up {{ qbittorrent_identifier }}" >&2;
  exit 1;
  done;
  echo "Failed to remove stale container {{ qbittorrent_identifier }} after {{ qbittorrent_container_cleanup_timeout_seconds }} attempts" >&2;
  exit 1

# Specify the timezone
qbittorrent_environment_variables_tz: 'Etc/UTC'

# qbittorrent_environment_variables_additional_variables contains a multiline string with additional environment variables to pass to the container.
#
# Example:
# qbittorrent_environment_variables_additional_variables: |
#   VAR=1
#   ANOTHER=value
qbittorrent_environment_variables_additional_variables: ""

# The path (as seen from within the container) where qBittorrent saves downloads by default.
# This is fed to `qbittorrent_config_overrides_default` (see below).
qbittorrent_config_bittorrent_session_default_save_path: "{{ qbittorrent_download_bind_path }}/"

# Controls whether qBittorrent validates the `Host` header of Web UI requests.
# This needs to be disabled when qBittorrent is served via a reverse-proxy,
# unless the reverse-proxy passes the expected `Host` header along.
# This is fed to `qbittorrent_config_overrides_default` (see below).
qbittorrent_config_preferences_webui_host_header_validation: "{{ 'false' if qbittorrent_container_labels_traefik_enabled | bool else 'true' }}"

# qbittorrent_config_overrides lets you set specific keys in qBittorrent's own
# `qBittorrent.conf` file, without touching any other settings in it (things
# you configure via the Web UI - categories, RSS feeds, trackers, statistics,
# etc. - are left alone).
#
# Each entry is a `section`/`option`/`value` triplet, matching the actual INI
# file structure. Give values as strings, matching exactly what qBittorrent
# itself would write to the file.
#
# Entries are applied in order, so if the same `section`/`option` is defined
# more than once, the last one wins. Because of the order below, this means
# that `_custom` overrides `_auto`, which overrides `_default`.
#
# These settings are enforced on every playbook run (i.e. if you change them
# by hand via the Web UI, the next playbook run reverts them back to what's
# defined here).
#
# Removing an entry from here does not restore the previous value of the
# setting - it merely stops the role from enforcing it. To go back to a
# different value, either define that value here or change it via the Web UI.
#
# qBittorrent reads this file at startup, keeps all settings in memory and
# rewrites the whole file from memory on a clean shutdown. The role therefore
# only modifies the file while the qBittorrent service is stopped - stopping it
# first if necessary and starting it back up afterwards, so that it's left in
# the state it was found in.
#
# Example:
# qbittorrent_config_overrides_custom:
#   - section: Preferences
#     option: WebUI\Address
#     value: "*"
#   - section: BitTorrent
#     option: Session\DefaultSavePath
#     value: /downloads/
qbittorrent_config_overrides: "{{ qbittorrent_config_overrides_default + qbittorrent_config_overrides_auto + qbittorrent_config_overrides_custom }}"
qbittorrent_config_overrides_default:
  - section: BitTorrent
    option: Session\DefaultSavePath
    value: "{{ qbittorrent_config_bittorrent_session_default_save_path }}"
  - section: Preferences
    option: WebUI\HostHeaderValidation
    value: "{{ qbittorrent_config_preferences_webui_host_header_validation }}"
qbittorrent_config_overrides_auto: []
qbittorrent_config_overrides_custom: []

# qbittorrent_restart_necessary controls whether the qBittorrent systemd
# service will be restarted (when true) or merely started (when false) by the
# systemd service manager role (when conditional restart is enabled).
#
# This value is automatically computed during installation based on whether
# any configuration files, the systemd service file, or the container image changed.
# The default of `false` means "no restart needed" — appropriate when the role's
# installation tasks haven't run (e.g., due to --tags skipping them).
qbittorrent_restart_necessary: false
