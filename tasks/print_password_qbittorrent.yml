---
- name: Get the qBittorrent temporary password log
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      journalctl -u {{ qbittorrent_identifier }} --no-pager --output=cat | grep -- 'A temporary password is provided for this session' | tail -n 1
    executable: /bin/bash
  register: qbittorrent_temporary_password_log
  changed_when: false
  # grep exits with 1 when it finds nothing, which the task below reports
  failed_when: qbittorrent_temporary_password_log.rc not in [0, 1]

- name: Extract the qBittorrent temporary password
  ansible.builtin.set_fact:
    qbittorrent_temporary_password: >-
      {{ qbittorrent_temporary_password_log.stdout | regex_search('password is provided for this session: ([A-Za-z0-9]+)', '\1') | default([], true) | first | default('') }}

- name: Print a warning if no qBittorrent temporary password was found
  ansible.builtin.fail:
    msg: "No temporary password log entry found in the {{ qbittorrent_identifier }} service logs"
  when: qbittorrent_temporary_password == ""

- name: Print just the qBittorrent temporary password
  ansible.builtin.debug:
    msg: "Your qBittorrent temporary password is: {{ qbittorrent_temporary_password }}"
