version = 1

# Computer-generated files and other files which cannot be copyrighted
[[annotations]]
path = [
    ".ansible-lint",
    ".github/renovate.json",
    ".gitignore",
    ".pre-commit-config.yaml",
    ".python-version",
    ".yamllint.yml",
    "meta/main.yml",
    "molecule/**/requirements.yml",
    "molecule/requirements.txt"
